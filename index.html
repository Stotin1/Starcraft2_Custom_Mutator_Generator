<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Starcraft Custom Mutator Project</title>
        <link rel="stylesheet" href="style.css">
        <!-- Bootstrap css -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>

    <body>
        <!-- A background container for additional style points -->
        <div class="container-fluid background">
            <!-- Primary container for the website, or the main body -->
            <div class="container-fluid container-main">
                <!-- Header / Title of page -->
                <div class="container text-center">
                    Starcraft 2
                </div>
                
                <!-- Commander and Presets Columns-->
                <div class="row">
                    <!-- Commanders-->
                    <div class="col-10">
                        <div class="container-fluid px-4" id="commander-cards">
                            <div class="row">
                                <!-- Template card for the commanders -->
                                <template id="commander-card-template">
                                    <!-- Commander -->
                                    <div class="col">
                                        <!-- Commander Card -->
                                        <div class="card commander-card">

                                            <!-- Portrait -->
                                            <img class="card-img-top commander-portrait" src="" alt="Commander Portrait">
                                    
                                            <!-- Commander Name and Prestige -->
                                            <div class="card-header text-center">
                                                <h3 class="commander-name">Raynor</h3>
                                                <p class="prestige">Renegade Commander</p>
                                            </div>
                                    
                                            <!-- Card Body -->
                                            <div class="card-body text-center">
                                                <!-- Prestige Select Button -->
                                                <div class="dropdown-center">

                                                    <!-- Prestige Dropdown Button -->
                                                    <button class="btn btn-secondary dropdown-toggle" type="button" id="dropdown-prestige-template"
                                                        data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                                                        Prestige Select
                                                    </button>

                                                    <!-- Prestige Dropdown Button Items -->
                                                    <div class="dropdown-menu prestige-select-button p-3" aria-labelledby="dropdown-prestige-template" data-bs-theme="dark">
                                                        <!-- This gets filled in via Javascript. See the generateCard() function -->
                                                    </div>

                                                </div>
                                                <!-- Mutator settings -->
                                                <div>
                                                    <div class="dropdown-center">
                                                        <!-- Mutator Dropdown Button -->
                                                        <button class="btn btn-secondary dropdown-toggle" type="button" id="dropdown-settings-template" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-haspopup="true" aria-expanded="false">
                                                            Mutator Settings
                                                        </button>
                                                        
                                                        <!-- Mutator Dropdown Button Items -->
                                                        <div class="dropdown-menu mutator-select-button p-3" aria-labelledby="dropdown-settings-template" data-bs-theme="dark">
                                                            <!-- This gets filled in via Javascript. See the generateCard() function -->
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>

                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                    <!-- Presets -->
                    <div class="col-2">
                        Presets
                    </div>
                </div>
            </div>
        </div>

        <!-- Bootstrap script -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>

        <!-- Custom scripts -->
        <script src="Mutator.js"></script>
        <script src="Prestige.js"></script>
        <script src="Commander.js"></script>
        <script src="script.js"></script>
    </body>
</html>
